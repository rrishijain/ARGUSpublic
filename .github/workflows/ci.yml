name: Student edition checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      voice_smoke:
        description: Install the pinned local voice stack and run a real speech round trip on all hosted platforms
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: npm run test:e2e
      - run: npm run release:check
      - run: npm audit --audit-level=high
  voice-install:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.voice_smoke)
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Foreground setup verifies hashes, creates its own Python, and runs the
      # Kokoro → English transcription round trip without an AI account.
      - run: npm run voice:setup
      - name: Verify a repeated installation reuses validated artifacts
        run: npm run voice:setup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-self-test-${{ matrix.os }}
          path: .argus-local/voice/install.json
          if-no-files-found: ignore
          retention-days: 14
